name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Install smoke test
        run: |
          npm pack
          npm install -g ./portlease-*.tgz
          export PORTLEASE_HOME="$(mktemp -d)"
          cd "$(mktemp -d)"
          printf 'WEB_PORT\nAPI_PORT\n' > .ports
          portlease claim --ports .ports --env .env.local
          grep -E '^WEB_PORT=[0-9]+$' .env.local
          grep -E '^API_PORT=[0-9]+$' .env.local
          portlease release
          test "$(portlease ls --json)" = "[]"
